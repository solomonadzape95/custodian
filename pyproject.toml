[project]
name = "custodian"
version = "0.1.0"
description = "An autonomous data steward for DataHub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-genai>=1.0.0",
    "mcp>=1.2.0",
    "acryl-datahub>=1.4.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
custodian = "custodian.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custodian*"]
